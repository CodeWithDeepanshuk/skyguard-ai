services:
  - type: web
    name: skyguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn skyguard.api.app:create_app --factory --app-dir src --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SKYGUARD_PUBLIC_MODE
        value: "true"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "2"
